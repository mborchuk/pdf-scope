# Optional local hooks. CI remains the authority: everything here is also
# checked in .github/workflows/ci.yml, so a contributor who does not install
# pre-commit is not at a disadvantage.
#
#   .venv/bin/pip install pre-commit && .venv/bin/pre-commit install
#   make hooks
#
# The Ruff revision is kept equal to the pin in requirements-dev.txt so that the
# hook and CI cannot disagree about formatting.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: forbid-submodules
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=256]

  - repo: local
    hooks:
      # Fixture PDFs are generated by tests/conftest.py. A committed PDF is
      # either someone's real document or an unreviewable binary; both are
      # unwanted. See CONTRIBUTING.md.
      - id: no-committed-pdfs
        name: PDFs must not be committed
        language: fail
        entry: "PDF fixtures are generated in tests/conftest.py — do not commit PDF files"
        files: '\.pdf$'
