[project]
name = "pdf-decompiler"
version = "0.1.0"
description = "Decompile PDF files: expose the full object model, contents and coordinates in a local web UI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mykola Borchuk" }]
keywords = ["pdf", "pymupdf", "extraction", "analysis", "reverse-engineering", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf==1.28.2",
    "fastapi==0.121.2",
    "uvicorn==0.52.4",
    "python-multipart==0.0.20",
]

[project.urls]
Homepage = "https://github.com/mv-borchuk/pdf-decompiler"
Documentation = "https://github.com/mv-borchuk/pdf-decompiler/tree/main/docs"
Changelog = "https://github.com/mv-borchuk/pdf-decompiler/blob/main/CHANGELOG.md"
Issues = "https://github.com/mv-borchuk/pdf-decompiler/issues"

[project.scripts]
pdf-decompiler = "pdf_decompiler.__main__:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdf_decompiler*"]

[tool.setuptools.package-data]
"pdf_decompiler.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
