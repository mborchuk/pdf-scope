name: Dependency audit

# Known vulnerabilities in the pinned dependency set. Dependabot alerts cover
# the same ground from GitHub's side; this job is the check that runs on a
# schedule regardless of repository settings, and that fails visibly.
on:
  schedule:
    # Mondays, 06:17 UTC. An odd minute avoids the top-of-hour queue.
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install -r requirements-audit.txt
      - name: Audit runtime and development dependencies
        run: |
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements-dev.txt \
            --strict \
            --progress-spinner off
